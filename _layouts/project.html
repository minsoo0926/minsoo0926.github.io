---
layout: default
---
<article class="project">
    <p><a href="/">← back</a></p>

    <div class="title">{{ page.title }}</div>

    {%- if page.links and page.links.size > 0 %}
    <div class="links">
        {%- for l in page.links -%}
            <a href="{{ l.url }}">{{ l.label }}</a>{% unless forloop.last %} · {% endunless %}
        {%- endfor %}
    </div>
    {%- endif %}

    {{ content }}
</article>
