---
layout: default
---
<article class="post">
    <p><a href="/">← back</a></p>

    <h1>{{ page.title }}</h1>
    <p class="meta">
        {{ page.date }}{% if page.author %} · {{ page.author }}{% else %} · Minsoo Ha{% endif %}
    </p>

    {%- if page.thumb_image %}
    <div class="hero">
        <img src="/assets/images/{{ page.thumb_image }}" alt="{{ page.title }}">
    </div>
    {%- endif %}

    {{ content }}
</article>
